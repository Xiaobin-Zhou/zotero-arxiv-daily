- name: Test SMTP Connection
        env:
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        run: |
          python -c "
          import smtplib, os
          from email.message import EmailMessage

          sender = os.environ.get('SENDER')
          receiver = os.environ.get('RECEIVER')
          password = os.environ.get('SENDER_PASSWORD')

          msg = EmailMessage()
          msg.set_content('This is a test email from GitHub Actions! Your SMTP configuration is working perfectly.')
          msg['Subject'] = 'GitHub Actions SMTP Test'
          msg['From'] = sender
          msg['To'] = receiver

          try:
              print('Attempting to connect to smtp.gmail.com on port 587...')
              server = smtplib.SMTP('smtp.gmail.com', 587)
              server.starttls()
              print('Attempting to log in...')
              server.login(sender, password)
              print('Sending email...')
              server.send_message(msg)
              server.quit()
              print('✅ Success! Test email dispatched.')
          except Exception as e:
              print('❌ Failed to send email. Error details:')
              print(e)
          "
